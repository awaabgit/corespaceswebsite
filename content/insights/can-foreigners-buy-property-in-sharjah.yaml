# Insight: Can foreigners buy property in Sharjah?
# Every number and legal reference is from an approved source, linked inline
# and listed under `sources`. No eligible projects are named because no
# approved source publishes a list.

title: "Can Foreigners Buy Property in Sharjah? 2026 Rules | CORE Spaces"
h1: "Can foreigners buy property in Sharjah? (2026 rules)"
meta_description: >-
  Yes, in approved projects. How Sharjah's 2022 ownership law works for
  non-GCC buyers, what usufruct means, and how to check a project first.
summary: >-
  Since 2022, non-GCC nationals can own Sharjah property outright in approved
  projects. Here's how the rules work and what to check before you pay.
published: "2026-10-20"
updated: "2026-10-20"
author: najam-mir
areas: [al-khan-sharjah]
og_image: /static/hero/hero2.jpg

sections:
  - heading: "The short answer"
    body: |
      Yes — but not everywhere. Since 2022, people who are not UAE or GCC
      nationals can own property outright in Sharjah, in real estate projects
      the emirate has approved for it. Outside those projects, the older route
      still applies: a usufruct right, which lets you use a property for up to
      100 years without owning it
      ([Gulf News](https://gulfnews.com/business/property/expats-owning-real-estate-in-sharjah-sheikh-sultan-issues-amendments-to-ownership-law-1.1667216757730), October 2022).

      By the end of September 2026, 52 projects had been approved for freehold
      ownership by non-citizens, eight of them during 2026, according to the
      Sharjah Real Estate Registration Department as reported by
      [Khaleej Times](https://www.khaleejtimes.com/business/indian-syrian-and-pakistani-investors-top-property-buyers-in-sharjah-in-2026)
      on 14 October 2026.

  - heading: "What changed in 2022"
    body: |
      Sharjah's general rule is that the right to own real estate in the
      emirate belongs to citizens of the UAE, followed by citizens of the GCC
      states. Law No. 2 of 2022, issued by the Ruler of Sharjah, Sheikh Sultan
      bin Muhammad Al Qasimi, amended the emirate's 2010 real estate
      registration law to set out exceptions to that rule
      ([Gulf News](https://gulfnews.com/business/property/expats-owning-real-estate-in-sharjah-sheikh-sultan-issues-amendments-to-ownership-law-1.1667216757730),
      October 2022).

      Those exceptions are:

      - ownership with the agreement of the Ruler;
      - property passed on by inheritance;
      - a transfer to a first-degree relative;
      - ownership in real estate development areas and projects, under
        regulations set by the Executive Council.

      The last one matters for most expat buyers. The Executive Council acted
      on it with Resolution No. 30 of 2022 on real estate ownership for
      non-citizens. Khaleej Times described the decision as allowing all
      nationalities full ownership, with no time restrictions, in real estate
      projects
      ([Khaleej Times](https://www.khaleejtimes.com/whats-fuelling-sharjahs-property-boom),
      April 2023).

  - heading: "Freehold or usufruct: what you're actually buying"
    body: |
      Freehold means you own the property: you can live in it, rent it out,
      sell it or leave it to your heirs. In Sharjah, that is open to foreign
      buyers in approved projects.

      Usufruct is different. Under Executive Council Resolution No. 26 of 2014,
      foreign nationals and foreign-owned companies in the UAE have the right of
      usufruct for a maximum of 100 years, registered with the Sharjah Real
      Estate Registration Department
      ([Gulf News](https://gulfnews.com/business/property/expats-owning-real-estate-in-sharjah-sheikh-sultan-issues-amendments-to-ownership-law-1.1667216757730)).
      You can use and benefit from the property for the term, but you don't
      own it outright.

      Until the 2022 change, usufruct was the only route for most foreign
      buyers. It still exists, so check which one a property offers before you
      compare prices.

  - heading: "Which projects qualify?"
    body: |
      Approval attaches to individual projects, not to whole neighbourhoods. The
      Sharjah Real Estate Registration Department reports the total — 52
      projects by September 2026
      ([Khaleej Times](https://www.khaleejtimes.com/business/indian-syrian-and-pakistani-investors-top-property-buyers-in-sharjah-in-2026)) — but we haven't
      found a public list of them from an official source.

      So check each project yourself. Ask the developer, in writing, whether the
      project is approved for freehold ownership by non-citizens before you pay
      a reservation fee, and confirm the title type with the registration
      department.

      If you're looking at [Seefa by Alef](/projects/seefa-by-alef) on the Al
      Khan beachfront, ask us and we'll confirm its ownership status with Alef
      in writing before you reserve.

  - heading: "Who is buying in Sharjah"
    body: |
      Foreign buyers are already a large part of the market. In January to
      September 2026, UAE citizens led by value with AED 22.4 billion. Indian
      investors were the biggest expatriate buyers at more than AED 6.8 billion,
      followed by Syrians at close to AED 2 billion, Pakistanis at
      AED 1.56 billion, Jordanians at AED 1.21 billion and Iraqis at
      AED 1.17 billion
      ([Khaleej Times](https://www.khaleejtimes.com/business/indian-syrian-and-pakistani-investors-top-property-buyers-in-sharjah-in-2026),
      14 October 2026).

      Over the same nine months, Sharjah's property transactions reached
      AED 46.8 billion, up 14% year on year
      ([Khaleej Times](https://www.khaleejtimes.com/business/sharjah-property-market-grows-14-as-transactions-reach-dh468-billion-in-9-months),
      13 October 2026). The busiest residential waterfront area is covered in
      our [Al Khan area guide](/areas/al-khan-sharjah).

  - heading: "Before you buy: a short checklist"
    body: |
      - Get written confirmation that the project is approved for freehold
        ownership by non-citizens.
      - Confirm whether you're buying freehold or a usufruct right, and for
        how long.
      - Pay the developer through its official channels, never an individual,
        and keep a receipt for every payment.
      - Read the sale and purchase agreement before you sign, including what
        happens if the project is delayed.
      - Ask for the current registration fees for your property; the Sharjah
        Real Estate Registration Department sets them.

faq:
  - q: "Can foreigners buy property in Sharjah?"
    a: >-
      Yes, in real estate projects approved for ownership by non-citizens.
      Sharjah had approved 52 such projects by the end of September 2026,
      according to the Sharjah Real Estate Registration Department.
  - q: "Is Sharjah property freehold for expats?"
    a: >-
      In approved projects, yes: full ownership with no time restriction.
      Elsewhere, foreign nationals can hold a usufruct right of up to 100 years.
  - q: "What is usufruct in Sharjah?"
    a: >-
      The right to use and benefit from a property for a fixed term without
      owning it. Under Executive Council Resolution No. 26 of 2014, foreign
      nationals can hold it for up to 100 years, registered with the Sharjah
      Real Estate Registration Department.
  - q: "How do I know if a Sharjah project is approved for foreign ownership?"
    a: >-
      Ask the developer to confirm it in writing before you pay anything, and
      check the title type with the Sharjah Real Estate Registration Department.

