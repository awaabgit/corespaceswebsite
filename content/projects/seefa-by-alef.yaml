intro: |
  Seefa by Alef — written by the developer as SEEF by Alef, and also searched as
  Al Seef by Alef — is a waterfront residential development by Alef Group on
  the Al Khan beachfront in Sharjah. It sits on Khan Open Beach, between the
  Arabian Gulf, Al Khan Lagoon and the Al Mamzar side of the Dubai border.

  Five residential buildings are planned on a 30,287 sqm waterfront site: three
  directly fronting the beach and two raised above a three-level podium, around
  a landscaped internal garden. Building 4 has 206 one, two and three bedroom
  residences.

