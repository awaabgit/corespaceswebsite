faq:
  - q: "Is it Seefa, SEEF or Al Seef by Alef?"
    a: >-
      All three names are used for the same Alef Group development on the Al
      Khan beachfront in Sharjah. Alef writes it SEEF by Alef; Seefa by Alef and
      Al Seef by Alef are common spellings of the same project.
  - q: "How much is a one-bedroom at Seefa by Alef?"
    a: >-
      In Building 4, one-bedroom apartments of about 61 sqm start from
      AED 895,000. Two-bedrooms (88 sqm) start from AED 1,295,000 and
      three-bedrooms (146 sqm) from AED 2,195,000, per Alef's factsheet as of
      October 2026.
  - q: "What is the payment plan?"
    a: >-
      Payment plan details are available on request. Send us your details using
      the form on this page and we'll send you the current plan and price list.
  - q: "Does Seefa have its own beach?"
    a: >-
      Seefa sits directly on Khan Open Beach, which is a public beach. The
      development has direct beachfront access and a publicly accessible
      waterfront promenade with shops and cafés.
  - q: "How far is it from Dubai?"
    a: >-
      About 10–15 minutes by car to the Dubai border at Al Mamzar, and 20–30
      minutes to Burj Khalifa and Dubai Mall, according to Alef.
  - q: "Can foreigners buy at Seefa?"
    a: >-
      Sharjah allows non-citizens to own property outright in projects the
      emirate has approved for it. Ask us and we'll confirm Seefa's ownership
      status with Alef in writing before you reserve.
  - q: "Can I use a mortgage?"
    a: >-
      Off-plan purchases are paid to the developer in instalments, and some
      buyers use a UAE mortgage for the payment due on completion. We can
      introduce you to mortgage advisers who can tell you what you'd qualify for.

